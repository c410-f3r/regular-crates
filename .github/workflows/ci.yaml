name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  internal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          components: clippy, rustfmt
          override: true
          profile: minimal
          toolchain: nightly-2026-05-07
      - uses: Swatinem/rust-cache@v2

      - run: .scripts/all.sh